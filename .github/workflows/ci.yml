name: SentraOps CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/sentraops_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_jwt_access_secret_key_12345
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_12345
      SMTP_HOST: localhost
      SMTP_USER: test@example.com
      SMTP_PASS: test_password

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentraops_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=src/models/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema=src/models/schema.prisma

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Verify API Startup Syntax
        run: node -e "require('./src/app'); console.log('API syntax verification passed.'); process.exit(0)"
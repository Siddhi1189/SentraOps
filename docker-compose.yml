version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentraops-postgres
    restart: always
    environment:
      POSTGRES_DB: sentraops
      POSTGRES_USER: sentraops_user
      POSTGRES_PASSWORD: sentraops_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentraops_user -d sentraops']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentraops-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentraops-api
    restart: always
    command: node src/index.js
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://sentraops_user:sentraops_password@postgres:5432/sentraops?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: default_jwt_access_secret_for_docker_prod_change_me
      JWT_REFRESH_SECRET: default_jwt_refresh_secret_for_docker_prod_change_me
      CLIENT_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentraops-worker
    restart: always
    command: node worker/worker.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sentraops_user:sentraops_password@postgres:5432/sentraops?schema=public
      REDIS_URL: redis://redis:6379
      HEALTH_CHECK_RETENTION_DAYS: 30
      AUDIT_LOG_RETENTION_DAYS: 90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
